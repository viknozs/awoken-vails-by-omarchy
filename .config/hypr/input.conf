# ==============================================================================
# Hyprland Input Config – Glorious Model O 2 PRO (4K/8K Edition)
# ==============================================================================

input {
    # Keyboard Setup (German Layout)
    kb_layout = de
    kb_options = compose:caps

    repeat_rate = 40
    repeat_delay = 250
    numlock_by_default = true

    # --------------------------------------------------------------------------
    # MOUSE SETTINGS (Glorious BAMF 2.0 Sensor)
    # --------------------------------------------------------------------------
    # 1:1 Pr&auml;zision ohne Linux-Mausbeschleunigung aktivieren
    accel_profile = flat

    # Standard-Sensitivit&auml;t f&uuml;r Hyprland (0 = Raw/1:1 Durchreiche vom BAMF 2.0 Sensor).
    # Falls dir die Maus bei 1600 DPI in Hyprland etwas zu schnell ist, passe diesen 
    # Wert leicht an (z.B. -0.2 f&uuml;r etwas langsamer oder 0.2 f&uuml;r schneller).
    sensitivity = 0.45

    # Optional: Scroll-Geschwindigkeit im Desktop anpassen
    scroll_factor = 1.0

    touchpad {
        clickfinger_behavior = true
        scroll_factor = 0.4
    }
}

# ------------------------------------------------------------------------------
# WINDOW RULES FOR TERMINALS (Touchpad/Mouse Scroll Fix)
# ------------------------------------------------------------------------------
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2
