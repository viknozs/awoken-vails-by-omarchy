# 1. Omarchy-Defaults auflösen (Unbinds)
unbind = SUPER, RETURN         # Entfernt Super+Enter (altes Terminal)
unbind = SUPER SHIFT, RETURN   # Entfernt Super+Shift+Enter (alter Browser)
unbind = SUPER SHIFT, B        # Entfernt Super+Shift+B (alter Browser-Hotkey)
unbind = SUPER SHIFT, F        # Entfernt Nautilus (Dateimanager)
unbind = SUPER ALT SHIFT, F    # Entfernt Nautilus CWD
unbind = SUPER, C              # Entfernt Omarchy Super+C Bind
unbind = SUPER, V              # Entfernt Omarchy Clipboard-Manager
unbind = SUPER, K              # Entfernt Omarchy Keybindings-Menü auf SUPER+K!

# 2. Keybindings-Menü auf eine neue Taste legen (Optional, z. B. Super+Shift+K)
bindd = SUPER SHIFT, K, Keybindings Menü, exec, omarchy-menu-keybindings

# 3. Neue App-Shortcuts
bindd = SUPER, K, Terminal (Kitty), exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER, F, Firefox, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, Dateimanager (Dolphin), exec, uwsm-app -- dolphin
bindd = SUPER ALT SHIFT, F, Dateimanager CWD (Dolphin), exec, uwsm-app -- dolphin "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, D, Dateimanager (Dolphin), exec, dolphin

# Zeile 28 & 29
bindd = SUPER, C, Zwischenablage Kopieren, exec, wtype -M ctrl c -m ctrl
bindd = SUPER, V, Zwischenablage Einfügen, exec, wtype -M ctrl v -m ctrl

# Zeile 30: Player mit 1.2 Skalierung
bindd = SUPER, S, Strawberry Music Player, exec, env QT_SCALE_FACTOR=1.2 uwsm-app -- strawberry
